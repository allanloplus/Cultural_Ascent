s+='<path d="M0 166c20-8 40 8 60 0s40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0 40 8 60 0V190H0Z" fill="#6aa8c4" opacity=".45"/>';
